name: Tests

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Crear entorno limpio
        run: |
          python -m venv .venv
          python -c "import os; from pathlib import Path; open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8').write(str(Path('.venv/bin').resolve()) + '\n')"
      - name: Instalar dependencias
        run: python -m pip install --no-deps -r requirements-dev.txt
      - name: Comprobar dependencias
        run: python -m pip check
      - name: Comprobar lint
        run: python -m ruff check .
      - name: Comprobar formato
        run: python -m ruff format --check .
      - name: Ejecutar pruebas y cobertura
        run: python -m pytest
      - name: Conservar reportes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reportes-linux-python-3.12
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn
          retention-days: 7
