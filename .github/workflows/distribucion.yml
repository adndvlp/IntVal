name: Distribución

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribucion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python para el verificador
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Construir y verificar la imagen final
        run: python qa_distribucion.py
      - name: Conservar evidencia de distribución
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reportes-distribucion
          path: temp/distribucion-qa/
          if-no-files-found: error
          retention-days: 7
